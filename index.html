<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>May Your Love Never End.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #060609;
      color: #ffffff;
      font-family: "Georgia", "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }

    canvas {
      display: block;
    }

    #hint {
      position: absolute;
      bottom: 20px;
      font-size: 13px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.65);
      font-family: sans-serif;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hint">اضغط في أي مكان لتشغيل الصوت وإعادة الحركة</div>

  <audio id="bgMusic" src="song.mp3.m4a" preload="auto"></audio>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const audio = document.getElementById("bgMusic");
    const hint = document.getElementById("hint");

    let width, height;
    let particles = [];
    let targets = [];
    let startTime = performance.now();

    const FULL_TEXT = "May Your Love Never End.";

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      generateTargets();
      initParticles();
    }

    function generateTargets() {
      targets = [];
      const offCanvas = document.createElement("canvas");
      const boxSize = Math.min(width * 0.88, height * 0.66, 540);
      offCanvas.width = Math.floor(boxSize);
      offCanvas.height = Math.floor(boxSize);
      const octx = offCanvas.getContext("2d");

      const s = boxSize / 400;
      octx.save();
      octx.scale(s, s);
      octx.strokeStyle = "#ffffff";
      octx.lineWidth = 2.4;
      octx.lineCap = "round";
      octx.lineJoin = "round";

      // 1. الشاب بالأعلى (رأس مرفوع وخصلات شعر + وجه متجه للأسفل واليمين)
      octx.beginPath();
      // محيط الشعر الخارجي للشاب
      octx.moveTo(98, 134);
      octx.bezierCurveTo(84, 86, 124, 42, 178, 38);
      octx.bezierCurveTo(216, 36, 238, 62, 224, 96);

      // خصلات الشعر المتتالية من اليسار لليمين
      octx.moveTo(108, 128);
      octx.bezierCurveTo(118, 76, 172, 52, 218, 72);

      octx.moveTo(122, 132);
      octx.bezierCurveTo(142, 82, 188, 68, 222, 86);

      octx.moveTo(138, 136);
      octx.bezierCurveTo(160, 96, 198, 86, 220, 98);

      // وجه الشاب (الجبين، الأنف، الفم، الذقن)
      octx.moveTo(214, 98);
      octx.lineTo(232, 118);
      octx.lineTo(220, 124);
      octx.quadraticCurveTo(224, 130, 218, 136);
      octx.quadraticCurveTo(216, 152, 194, 156);
      octx.lineTo(176, 153);

      // العين المغلقة للشاب
      octx.moveTo(196, 108);
      octx.quadraticCurveTo(204, 112, 211, 107);

      // رقبة وكتف الشاب
      octx.moveTo(130, 136);
      octx.bezierCurveTo(120, 182, 96, 232, 90, 286);
      octx.lineTo(88, 352);

      octx.moveTo(178, 154);
      octx.quadraticCurveTo(178, 184, 158, 212);
      octx.stroke();

      // 2. الفتاة بالأسفل (وجه متجه للأعلى واليسار + شعر طويل منسدل للأسفل)
      octx.beginPath();
      // جبهة وأنف وشفاه وذقن الفتاة
      octx.moveTo(208, 182);
      octx.lineTo(182, 204);
      octx.lineTo(190, 212);
      octx.quadraticCurveTo(186, 219, 194, 225);
      octx.quadraticCurveTo(200, 242, 222, 244);

      // حاجب وعين الفتاة
      octx.moveTo(204, 195);
      octx.quadraticCurveTo(214, 190, 223, 196);
      octx.moveTo(206, 202);
      octx.quadraticCurveTo(214, 198, 222, 203);

      // شعر الفتاة الطويل المنسدل للأسفل على اليمين
      octx.moveTo(208, 182);
      octx.bezierCurveTo(246, 170, 280, 198, 290, 246);
      octx.bezierCurveTo(298, 284, 284, 318, 302, 356);

      octx.moveTo(228, 188);
      octx.bezierCurveTo(258, 214, 254, 266, 246, 308);
      octx.quadraticCurveTo(242, 332, 256, 356);

      octx.moveTo(246, 198);
      octx.bezierCurveTo(272, 228, 270, 280, 266, 320);
      octx.lineTo(278, 356);

      octx.moveTo(262, 210);
      octx.bezierCurveTo(282, 240, 280, 288, 278, 324);
      octx.lineTo(290, 356);

      // رقبة وكتف الفتاة
      octx.moveTo(222, 244);
      octx.bezierCurveTo(220, 276, 194, 306, 164, 356);
      octx.stroke();

      // 3. قلب صغير على اليمين فوق شعر الفتاة
      octx.beginPath();
      octx.moveTo(264, 144);
      octx.bezierCurveTo(264, 135, 251, 135, 251, 145);
      octx.bezierCurveTo(251, 154, 264, 162, 264, 167);
      octx.bezierCurveTo(264, 162, 277, 154, 277, 145);
      octx.bezierCurveTo(277, 135, 264, 135, 264, 144);
      octx.stroke();

      octx.restore();

      const imgData = octx.getImageData(0, 0, offCanvas.width, offCanvas.height).data;
      const step = Math.max(3, Math.floor(boxSize / 165));
      const offsetX = (width - offCanvas.width) / 2;
      const offsetY = (height - offCanvas.height) / 2 + 28;

      for (let y = 0; y < offCanvas.height; y += step) {
        for (let x = 0; x < offCanvas.width; x += step) {
          const idx = (y * offCanvas.width + x) * 4;
          if (imgData[idx + 3] > 110) {
            targets.push({
              x: offsetX + x + (Math.random() - 0.5) * 1.2,
              y: offsetY + y + (Math.random() - 0.5) * 1.2
            });
          }
        }
      }
    }

    function initParticles() {
      particles = [];
      const bgStarsCount = 300;

      for (let i = 0; i < targets.length; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          tx: targets[i].x,
          ty: targets[i].y,
          isTarget: true,
          size: Math.random() * 1.15 + 1.0,
          speed: 0.022 + Math.random() * 0.024,
          phase: Math.random() * Math.PI * 2
        });
      }

      for (let i = 0; i < bgStarsCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.12,
          vy: (Math.random() - 0.5) * 0.12,
          isTarget: false,
          size: Math.random() * 1.0 + 0.5,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function animate(now) {
      const elapsed = (now - startTime) / 1000;

      ctx.fillStyle = "rgba(6, 6, 9, 0.36)";
      ctx.fillRect(0, 0, width, height);

      const spawnProgress = Math.min(1, elapsed / 1.8);
      const visibleCount = Math.floor(particles.length * spawnProgress);

      for (let i = 0; i < visibleCount; i++) {
        const p = particles[i];
        const twinkle = 0.72 + 0.28 * Math.sin(elapsed * 3.0 + p.phase);

        if (p.isTarget) {
          if (elapsed > 1.8) {
            p.x += (p.tx - p.x) * p.speed;
            p.y += (p.ty - p.y) * p.speed;
            p.x += Math.sin(elapsed * 2.0 + p.phase) * 0.05;
            p.y += Math.cos(elapsed * 2.0 + p.phase) * 0.05;
          } else {
            p.x += Math.sin(elapsed + p.phase) * 0.3;
            p.y += Math.cos(elapsed + p.phase) * 0.3;
          }
        } else {
          p.x = (p.x + p.vx + width) % width;
          p.y = (p.y + p.vy + height) % height;
        }

        ctx.globalAlpha = twinkle;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      if (elapsed > 10.6) {
        const textElapsed = elapsed - 10.6;
        const charCount = Math.min(FULL_TEXT.length, Math.floor(textElapsed * 6.8));
        const currentText = FULL_TEXT.slice(0, charCount);

        const fontSize = Math.max(22, Math.min(34, width * 0.035));
        ctx.font = `italic ${fontSize}px Georgia, "Times New Roman", serif`;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";

        const boxSize = Math.min(width * 0.88, height * 0.66, 540);
        const textY = Math.max(58, (height - boxSize) / 2 - 8);
        ctx.fillText(currentText, width / 2, textY);
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("click", () => {
      audio.currentTime = 0;
      audio.play().catch(() => {});
      startTime = performance.now();
      initParticles();
      hint.style.opacity = "0";
    });

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
