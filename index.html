<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>May Your Love Never End.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050508;
      color: #ffffff;
      font-family: "Georgia", "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }

    canvas {
      display: block;
    }

    #hint {
      position: absolute;
      bottom: 20px;
      font-size: 13px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.65);
      font-family: sans-serif;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hint">اضغط في أي مكان لتشغيل الصوت وإعادة الحركة</div>

  <audio id="bgMusic" src="song.mp3.m4a" preload="auto"></audio>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const audio = document.getElementById("bgMusic");
    const hint = document.getElementById("hint");

    let width, height;
    let particles = [];
    let targets = [];
    let startTime = performance.now();

    const FULL_TEXT = "May Your Love Never End.";

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      generateTargets();
      initParticles();
    }

    function generateTargets() {
      targets = [];
      const offCanvas = document.createElement("canvas");
      const boxSize = Math.min(width * 0.86, height * 0.64, 520);
      offCanvas.width = Math.floor(boxSize);
      offCanvas.height = Math.floor(boxSize);
      const octx = offCanvas.getContext("2d");

      const s = boxSize / 400;
      octx.save();
      octx.scale(s, s);
      octx.strokeStyle = "#ffffff";
      octx.lineWidth = 2.6;
      octx.lineCap = "round";
      octx.lineJoin = "round";

      // الشاب بالأعلى متجهاً للأسفل ولليمين
      octx.beginPath();
      // شعر كثيف وخصلات متموّجة للخلف والأعلى
      octx.moveTo(104, 134);
      octx.bezierCurveTo(86, 90, 122, 46, 172, 42);
      octx.bezierCurveTo(212, 38, 238, 68, 224, 102);

      octx.moveTo(114, 126);
      octx.bezierCurveTo(124, 78, 174, 56, 214, 78);

      octx.moveTo(128, 132);
      octx.bezierCurveTo(148, 86, 192, 74, 220, 94);

      octx.moveTo(144, 136);
      octx.bezierCurveTo(164, 98, 200, 90, 218, 104);

      // جبهة وأنف وشفاه وذقن الشاب
      octx.moveTo(214, 102);
      octx.lineTo(228, 122);
      octx.lineTo(218, 128);
      octx.quadraticCurveTo(222, 134, 216, 140);
      octx.quadraticCurveTo(214, 156, 192, 160);
      octx.lineTo(174, 157);

      // عين الشاب المغلقة
      octx.moveTo(194, 112);
      octx.quadraticCurveTo(202, 116, 209, 111);

      // رقبة وكتف الشاب
      octx.moveTo(132, 138);
      octx.bezierCurveTo(122, 186, 98, 236, 92, 290);
      octx.lineTo(90, 352);

      octx.moveTo(176, 158);
      octx.quadraticCurveTo(176, 188, 156, 216);
      octx.stroke();

      // الفتاة بالأسفل متجهة للأعلى ولليسار
      octx.beginPath();
      // جبهة وأنف وشفاه وذقن الفتاة
      octx.moveTo(206, 184);
      octx.lineTo(180, 205);
      octx.lineTo(188, 213);
      octx.quadraticCurveTo(184, 220, 192, 226);
      octx.quadraticCurveTo(198, 244, 220, 246);

      // حاجب وعين الفتاة
      octx.moveTo(202, 197);
      octx.quadraticCurveTo(212, 192, 221, 198);
      octx.moveTo(204, 204);
      octx.quadraticCurveTo(212, 200, 220, 205);

      // شعر الفتاة الطويل المتموج للأسفل
      octx.moveTo(206, 184);
      octx.bezierCurveTo(244, 172, 278, 200, 288, 246);
      octx.bezierCurveTo(296, 284, 282, 318, 300, 354);

      octx.moveTo(226, 190);
      octx.bezierCurveTo(256, 216, 252, 266, 244, 308);
      octx.quadraticCurveTo(240, 332, 254, 354);

      octx.moveTo(244, 200);
      octx.bezierCurveTo(270, 230, 268, 280, 264, 320);
      octx.lineTo(276, 354);

      octx.moveTo(260, 212);
      octx.bezierCurveTo(280, 242, 278, 288, 276, 324);
      octx.lineTo(288, 354);

      // رقبة وكتف الفتاة
      octx.moveTo(220, 246);
      octx.bezierCurveTo(218, 278, 192, 308, 162, 354);
      octx.stroke();

      // قلب صغير على اليمين بينهما
      octx.beginPath();
      octx.moveTo(258, 146);
      octx.bezierCurveTo(258, 137, 245, 137, 245, 147);
      octx.bezierCurveTo(245, 156, 258, 164, 258, 169);
      octx.bezierCurveTo(258, 164, 271, 156, 271, 147);
      octx.bezierCurveTo(271, 137, 258, 137, 258, 146);
      octx.stroke();

      octx.restore();

      const imgData = octx.getImageData(0, 0, offCanvas.width, offCanvas.height).data;
      const step = Math.max(3, Math.floor(boxSize / 160));
      const offsetX = (width - offCanvas.width) / 2;
      const offsetY = (height - offCanvas.height) / 2 + 28;

      for (let y = 0; y < offCanvas.height; y += step) {
        for (let x = 0; x < offCanvas.width; x += step) {
          const idx = (y * offCanvas.width + x) * 4;
          if (imgData[idx + 3] > 110) {
            targets.push({
              x: offsetX + x + (Math.random() - 0.5) * 1.4,
              y: offsetY + y + (Math.random() - 0.5) * 1.4
            });
          }
        }
      }
    }

    function initParticles() {
      particles = [];
      const bgStarsCount = 320;

      for (let i = 0; i < targets.length; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          tx: targets[i].x,
          ty: targets[i].y,
          isTarget: true,
          size: Math.random() * 1.2 + 1.0,
          speed: 0.022 + Math.random() * 0.024,
          phase: Math.random() * Math.PI * 2
        });
      }

      for (let i = 0; i < bgStarsCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.12,
          vy: (Math.random() - 0.5) * 0.12,
          isTarget: false,
          size: Math.random() * 1.1 + 0.5,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function animate(now) {
      const elapsed = (now - startTime) / 1000;

      ctx.fillStyle = "rgba(5, 5, 8, 0.36)";
      ctx.fillRect(0, 0, width, height);

      const spawnProgress = Math.min(1, elapsed / 1.8);
      const visibleCount = Math.floor(particles.length * spawnProgress);

      for (let i = 0; i < visibleCount; i++) {
        const p = particles[i];
        const twinkle = 0.72 + 0.28 * Math.sin(elapsed * 3.0 + p.phase);

        if (p.isTarget) {
          if (elapsed > 1.8) {
            p.x += (p.tx - p.x) * p.speed;
            p.y += (p.ty - p.y) * p.speed;
            p.x += Math.sin(elapsed * 2.0 + p.phase) * 0.06;
            p.y += Math.cos(elapsed * 2.0 + p.phase) * 0.06;
          } else {
            p.x += Math.sin(elapsed + p.phase) * 0.3;
            p.y += Math.cos(elapsed + p.phase) * 0.3;
          }
        } else {
          p.x = (p.x + p.vx + width) % width;
          p.y = (p.y + p.vy + height) % height;
        }

        ctx.globalAlpha = twinkle;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      if (elapsed > 10.8) {
        const textElapsed = elapsed - 10.8;
        const charCount = Math.min(FULL_TEXT.length, Math.floor(textElapsed * 6.8));
        const currentText = FULL_TEXT.slice(0, charCount);

        const fontSize = Math.max(22, Math.min(34, width * 0.035));
        ctx.font = `italic ${fontSize}px Georgia, "Times New Roman", serif`;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";

        const boxSize = Math.min(width * 0.86, height * 0.64, 520);
        const textY = Math.max(58, (height - boxSize) / 2 - 8);
        ctx.fillText(currentText, width / 2, textY);
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("click", () => {
      audio.currentTime = 0;
      audio.play().catch(() => {});
      startTime = performance.now();
      initParticles();
      hint.style.opacity = "0";
    });

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
