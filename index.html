<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>May Your Love Never End</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050508;
      color: #ffffff;
      font-family: "Georgia", "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }

    canvas {
      display: block;
    }

    #hint {
      position: absolute;
      bottom: 24px;
      font-size: 14px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.55);
      font-family: sans-serif;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hint">اضغط في أي مكان لتشغيل الصوت وإعادة الحركة</div>

  <!-- ملف الصوت في نفس المجلد -->
  <audio id="bgMusic" src="song.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const audio = document.getElementById("bgMusic");
    const hint = document.getElementById("hint");

    let width, height;
    let particles = [];
    let targets = [];
    let startTime = performance.now();

    const FULL_TEXT = "May Your Love Never End.";
    const COLORS = [
      "rgba(255, 255, 255, 0.95)",
      "rgba(245, 210, 230, 0.9)",
      "rgba(215, 225, 255, 0.9)",
      "rgba(255, 190, 215, 0.85)"
    ];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      generateTargets();
      initParticles();
    }

    // توليد نقاط الشكل (رسم خطي لزوجين مع قلب صغير)
    function generateTargets() {
      targets = [];
      const offCanvas = document.createElement("canvas");
      const size = Math.min(width, height) * 0.62;
      offCanvas.width = size;
      offCanvas.height = size;
      const octx = offCanvas.getContext("2d");

      octx.strokeStyle = "#ffffff";
      octx.lineWidth = Math.max(2.5, size * 0.008);
      octx.lineCap = "round";
      octx.lineJoin = "round";

      const s = size / 400; // مقياس الرسم
      octx.save();
      octx.scale(s, s);

      // --- رسم الشاب (أعلى اليسار) ---
      octx.beginPath();
      // الشعر من الخلف والأعلى
      octx.moveTo(110, 145);
      octx.quadraticCurveTo(95, 100, 130, 75);
      octx.quadraticCurveTo(165, 50, 205, 70);
      octx.quadraticCurveTo(230, 82, 222, 105);
      // خصلات الشعر الأمامية
      octx.quadraticCurveTo(195, 95, 175, 110);
      octx.quadraticCurveTo(155, 125, 145, 145);
      octx.stroke();

      // ملامح وجه الشاب (الجبين، الأنف، الشفاه، الذقن)
      octx.beginPath();
      octx.moveTo(212, 102);
      octx.lineTo(222, 125); // الأنف
      octx.lineTo(214, 132);
      octx.quadraticCurveTo(218, 138, 212, 144); // الشفاه
      octx.quadraticCurveTo(210, 158, 190, 162); // الذقن
      octx.lineTo(172, 158);
      octx.stroke();

      // عين الشاب المغلقة
      octx.beginPath();
      octx.moveTo(192, 114);
      octx.quadraticCurveTo(200, 118, 207, 114);
      octx.stroke();

      // رقبة وكتف الشاب
      octx.beginPath();
      octx.moveTo(135, 148);
      octx.quadraticCurveTo(125, 195, 105, 250);
      octx.quadraticCurveTo(95, 290, 115, 345);
      octx.moveTo(175, 162);
      octx.quadraticCurveTo(175, 195, 160, 225);
      octx.stroke();

      // --- رسم الفتاة (أسفل اليمين) ---
      octx.beginPath();
      // جبين وأنف وذقن الفتاة (تنظر للأعلى)
      octx.moveTo(205, 185);
      octx.quadraticCurveTo(192, 198, 182, 206); // الأنف
      octx.lineTo(188, 214);
      octx.quadraticCurveTo(185, 222, 192, 228); // الشفاه
      octx.quadraticCurveTo(196, 244, 218, 245); // الذقن
      octx.stroke();

      // عين الفتاة
      octx.beginPath();
      octx.moveTo(204, 204);
      octx.quadraticCurveTo(212, 200, 219, 205);
      octx.stroke();

      // شعر الفتاة المتموج
      octx.beginPath();
      octx.moveTo(205, 185);
      octx.quadraticCurveTo(235, 175, 265, 205);
      octx.quadraticCurveTo(295, 235, 285, 280);
      octx.quadraticCurveTo(275, 315, 295, 345);

      // خصلات داخلية للشعر
      octx.moveTo(232, 195);
      octx.quadraticCurveTo(255, 225, 245, 275);
      octx.quadraticCurveTo(238, 315, 255, 345);
      octx.stroke();

      // رقبة وكتف الفتاة
      octx.beginPath();
      octx.moveTo(218, 245);
      octx.quadraticCurveTo(215, 275, 195, 305);
      octx.quadraticCurveTo(175, 325, 165, 345);
      octx.stroke();

      // --- قلب صغير بجانبهم ---
      octx.beginPath();
      octx.moveTo(252, 152);
      octx.bezierCurveTo(252, 144, 240, 144, 240, 153);
      octx.bezierCurveTo(240, 161, 252, 168, 252, 172);
      octx.bezierCurveTo(252, 168, 264, 161, 264, 153);
      octx.bezierCurveTo(264, 144, 252, 144, 252, 152);
      octx.stroke();

      octx.restore();

      // استخراج إحداثيات البكسلات المرسومة
      const imgData = octx.getImageData(0, 0, size, size).data;
      const step = Math.max(3, Math.floor(size / 135));
      const offsetX = (width - size) / 2;
      const offsetY = (height - size) / 2 + 30;

      for (let y = 0; y < size; y += step) {
        for (let x = 0; x < size; x += step) {
          const idx = (y * size + x) * 4;
          if (imgData[idx + 3] > 128) {
            targets.push({
              x: offsetX + x + (Math.random() - 0.5) * 2.5,
              y: offsetY + y + (Math.random() - 0.5) * 2.5
            });
          }
        }
      }
    }

    function initParticles() {
      particles = [];
      const bgStars = 280; // نجوم خلفية عشوائية

      // جسيمات الشكل
      for (let i = 0; i < targets.length; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          tx: targets[i].x,
          ty: targets[i].y,
          isTarget: true,
          size: Math.random() * 1.6 + 0.9,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          speed: 0.015 + Math.random() * 0.025,
          phase: Math.random() * Math.PI * 2
        });
      }

      // نجوم الخلفية الثابتة/المتحركة ببطء
      for (let i = 0; i < bgStars; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.15,
          vy: (Math.random() - 0.5) * 0.15,
          isTarget: false,
          size: Math.random() * 1.3 + 0.4,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function animate(now) {
      const elapsed = (now - startTime) / 1000; // بالثواني

      // مسح الشاشة مع أثر خفيف جداً
      ctx.fillStyle = "rgba(5, 5, 8, 0.35)";
      ctx.fillRect(0, 0, width, height);

      // نسبة ظهور النقاط في البداية (أول ثانيتين)
      const spawnProgress = Math.min(1, elapsed / 2.2);
      const visibleCount = Math.floor(particles.length * spawnProgress);

      for (let i = 0; i < visibleCount; i++) {
        const p = particles[i];
        const twinkle = 0.65 + 0.35 * Math.sin(elapsed * 3 + p.phase);

        if (p.isTarget) {
          // بعد 2.2 ثانية تبدأ النقاط في التجمع لتكوين الرسمة
          if (elapsed > 2.2) {
            p.x += (p.tx - p.x) * p.speed;
            p.y += (p.ty - p.y) * p.speed;
            // اهتزاز بسيط يعطي حيوية للنجوم
            p.x += Math.sin(elapsed * 2 + p.phase) * 0.12;
            p.y += Math.cos(elapsed * 2 + p.phase) * 0.12;
          } else {
            p.x += Math.sin(elapsed + p.phase) * 0.4;
            p.y += Math.cos(elapsed + p.phase) * 0.4;
          }
        } else {
          p.x = (p.x + p.vx + width) % width;
          p.y = (p.y + p.vy + height) % height;
        }

        ctx.globalAlpha = twinkle;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      // كتابة النص تدريجياً بعد اكتمال الرسمة (عند الثانية 10.5)
      if (elapsed > 10.5) {
        const textElapsed = elapsed - 10.5;
        const charCount = Math.min(FULL_TEXT.length, Math.floor(textElapsed * 6.5));
        const currentText = FULL_TEXT.slice(0, charCount);

        const fontSize = Math.max(20, Math.min(34, width * 0.032));
        ctx.font = `italic ${fontSize}px Georgia, "Times New Roman", serif`;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(255, 220, 240, 0.6)";
        ctx.shadowBlur = 10;

        const textY = Math.max(70, (height - Math.min(width, height) * 0.62) / 2);
        ctx.fillText(currentText, width / 2, textY);
        ctx.shadowBlur = 0;
      }

      requestAnimationFrame(animate);
    }

    // المتصفحات تمنع تشغيل الصوت تلقائياً إلا بعد نقرة من المستخدم
    window.addEventListener("click", () => {
      audio.currentTime = 0;
      audio.play().catch(() => {});
      startTime = performance.now();
      initParticles();
      hint.style.opacity = "0";
    });

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
