<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>May Your Love Never End.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050508;
      color: #ffffff;
      font-family: "Georgia", "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }

    canvas {
      display: block;
    }

    #hint {
      position: absolute;
      bottom: 22px;
      font-size: 13px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.65);
      font-family: sans-serif;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hint">اضغط في أي مكان لتشغيل الصوت وإعادة الحركة</div>

  <audio id="bgMusic" src="song.mp3.m4a" preload="auto"></audio>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const audio = document.getElementById("bgMusic");
    const hint = document.getElementById("hint");

    let width, height;
    let particles = [];
    let targets = [];
    let startTime = performance.now();

    const FULL_TEXT = "May Your Love Never End.";

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      generateTargets();
      initParticles();
    }

    function generateTargets() {
      targets = [];
      const offCanvas = document.createElement("canvas");
      const boxSize = Math.min(width * 0.88, height * 0.66, 540);
      offCanvas.width = Math.floor(boxSize);
      offCanvas.height = Math.floor(boxSize);
      const octx = offCanvas.getContext("2d");

      const s = boxSize / 400;
      octx.save();
      octx.scale(s, s);
      octx.strokeStyle = "#ffffff";
      octx.lineWidth = 3.0;
      octx.lineCap = "round";
      octx.lineJoin = "round";

      // الشاب في الأعلى (وجهه متجه للأسفل/اليمين وشعره كثيف للأعلى واليسار)
      octx.beginPath();
      // قمة الشعر الكثيف وخصلاته
      octx.moveTo(106, 136);
      octx.bezierCurveTo(92, 92, 124, 52, 168, 46);
      octx.bezierCurveTo(206, 42, 236, 70, 226, 106);
      // خصلات الشعر الأمامية والعلوية
      octx.moveTo(118, 128);
      octx.quadraticCurveTo(132, 78, 178, 66);
      octx.quadraticCurveTo(208, 62, 222, 92);
      octx.moveTo(136, 134);
      octx.quadraticCurveTo(156, 88, 198, 84);
      octx.moveTo(152, 138);
      octx.quadraticCurveTo(172, 102, 208, 98);

      // جبهة وأنف وشفاه وذقن الشاب
      octx.moveTo(214, 102);
      octx.lineTo(226, 124);
      octx.lineTo(216, 130);
      octx.quadraticCurveTo(220, 136, 214, 142);
      octx.quadraticCurveTo(212, 158, 190, 162);
      octx.lineTo(172, 158);

      // عين الشاب المغلقة
      octx.moveTo(192, 114);
      octx.quadraticCurveTo(200, 118, 208, 113);

      // رقبة وكتف الشاب
      octx.moveTo(132, 140);
      octx.bezierCurveTo(124, 188, 102, 238, 96, 292);
      octx.lineTo(94, 348);
      octx.moveTo(176, 160);
      octx.quadraticCurveTo(176, 190, 158, 220);
      octx.stroke();

      // الفتاة في الأسفل (تنظر للأعلى واليسار وشعرها طويل متموج للأسفل)
      octx.beginPath();
      // جبهة وأنف وشفاه وذقن الفتاة
      octx.moveTo(206, 186);
      octx.lineTo(182, 206);
      octx.lineTo(189, 214);
      octx.quadraticCurveTo(185, 221, 193, 227);
      octx.quadraticCurveTo(198, 244, 220, 246);

      // عين وحاجب الفتاة
      octx.moveTo(204, 204);
      octx.quadraticCurveTo(212, 200, 220, 205);
      octx.moveTo(203, 197);
      octx.quadraticCurveTo(212, 193, 221, 198);

      // شعر الفتاة الطويل المتموج
      octx.moveTo(206, 186);
      octx.bezierCurveTo(242, 174, 276, 202, 286, 246);
      octx.bezierCurveTo(294, 282, 282, 318, 298, 350);

      // خصلات داخل شعر الفتاة
      octx.moveTo(228, 192);
      octx.bezierCurveTo(256, 218, 252, 266, 244, 306);
      octx.quadraticCurveTo(240, 330, 254, 350);
      octx.moveTo(246, 202);
      octx.bezierCurveTo(270, 232, 268, 280, 264, 318);
      octx.lineTo(274, 350);

      // رقبة وكتف الفتاة
      octx.moveTo(220, 246);
      octx.bezierCurveTo(218, 278, 194, 308, 166, 350);
      octx.stroke();

      // قلب صغير بجانبهما
      octx.beginPath();
      octx.moveTo(256, 150);
      octx.bezierCurveTo(256, 141, 243, 141, 243, 151);
      octx.bezierCurveTo(243, 160, 256, 168, 256, 173);
      octx.bezierCurveTo(256, 168, 269, 160, 269, 151);
      octx.bezierCurveTo(269, 141, 256, 141, 256, 150);
      octx.stroke();

      octx.restore();

      const imgData = octx.getImageData(0, 0, offCanvas.width, offCanvas.height).data;
      const step = Math.max(3, Math.floor(boxSize / 155));
      const offsetX = (width - offCanvas.width) / 2;
      const offsetY = (height - offCanvas.height) / 2 + 28;

      for (let y = 0; y < offCanvas.height; y += step) {
        for (let x = 0; x < offCanvas.width; x += step) {
          const idx = (y * offCanvas.width + x) * 4;
          if (imgData[idx + 3] > 120) {
            targets.push({
              x: offsetX + x + (Math.random() - 0.5) * 1.8,
              y: offsetY + y + (Math.random() - 0.5) * 1.8
            });
          }
        }
      }
    }

    function initParticles() {
      particles = [];
      const bgStarsCount = 360;

      for (let i = 0; i < targets.length; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          tx: targets[i].x,
          ty: targets[i].y,
          isTarget: true,
          size: Math.random() * 1.3 + 1.0,
          speed: 0.02 + Math.random() * 0.024,
          phase: Math.random() * Math.PI * 2
        });
      }

      for (let i = 0; i < bgStarsCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.14,
          vy: (Math.random() - 0.5) * 0.14,
          isTarget: false,
          size: Math.random() * 1.2 + 0.5,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function animate(now) {
      const elapsed = (now - startTime) / 1000;

      ctx.fillStyle = "rgba(5, 5, 8, 0.38)";
      ctx.fillRect(0, 0, width, height);

      const spawnProgress = Math.min(1, elapsed / 2.0);
      const visibleCount = Math.floor(particles.length * spawnProgress);

      for (let i = 0; i < visibleCount; i++) {
        const p = particles[i];
        const twinkle = 0.7 + 0.3 * Math.sin(elapsed * 3.0 + p.phase);

        if (p.isTarget) {
          if (elapsed > 2.0) {
            p.x += (p.tx - p.x) * p.speed;
            p.y += (p.ty - p.y) * p.speed;
            p.x += Math.sin(elapsed * 2.0 + p.phase) * 0.08;
            p.y += Math.cos(elapsed * 2.0 + p.phase) * 0.08;
          } else {
            p.x += Math.sin(elapsed + p.phase) * 0.35;
            p.y += Math.cos(elapsed + p.phase) * 0.35;
          }
        } else {
          p.x = (p.x + p.vx + width) % width;
          p.y = (p.y + p.vy + height) % height;
        }

        ctx.globalAlpha = twinkle;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      if (elapsed > 10.2) {
        const textElapsed = elapsed - 10.2;
        const charCount = Math.min(FULL_TEXT.length, Math.floor(textElapsed * 6.5));
        const currentText = FULL_TEXT.slice(0, charCount);

        const fontSize = Math.max(22, Math.min(36, width * 0.036));
        ctx.font = `italic ${fontSize}px Georgia, "Times New Roman", serif`;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";

        const boxSize = Math.min(width * 0.88, height * 0.66, 540);
        const textY = Math.max(62, (height - boxSize) / 2 - 6);
        ctx.fillText(currentText, width / 2, textY);
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("click", () => {
      audio.currentTime = 0;
      audio.play().catch(() => {});
      startTime = performance.now();
      initParticles();
      hint.style.opacity = "0";
    });

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
