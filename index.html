<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>May Your Love Never End.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #12091c;
      color: #ffffff;
      font-family: "Georgia", "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }

    canvas {
      display: block;
    }

    #hint {
      position: absolute;
      bottom: 18px;
      font-size: 13px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.65);
      font-family: sans-serif;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hint">اضغط في أي مكان لتشغيل الصوت وإعادة الحركة</div>

  <audio id="bgMusic" src="song.mp3.m4a" preload="auto"></audio>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const audio = document.getElementById("bgMusic");
    const hint = document.getElementById("hint");

    let width, height;
    let particles = [];
    let targets = [];
    let startTime = performance.now();
    let loadedImage = null;

    const FULL_TEXT = "May Your Love Never End.";
    const IMAGE_SOURCES = [
      "couple.jpg",
      "couple.png",
      "Screenshot_٢٠٢٦-١١-٢٠-١٤-١٠-٤٩-٠١٥_com.miui.gallery-edit.jpg"
    ];

    function tryLoadImage(index = 0) {
      if (index >= IMAGE_SOURCES.length) {
        initParticles();
        return;
      }

      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        extractTargetsFromImage(img);
        initParticles();
      };
      img.onerror = () => {
        tryLoadImage(index + 1);
      };
      img.src = encodeURI(IMAGE_SOURCES[index]);
    }

    function extractTargetsFromImage(img) {
      targets = [];
      const boxSize = Math.min(width * 0.88, height * 0.68, 560);
      const sampleSize = 270;

      const off = document.createElement("canvas");
      off.width = sampleSize;
      off.height = sampleSize;
      const octx = off.getContext("2d");
      octx.fillStyle = "#12091c";
      octx.fillRect(0, 0, sampleSize, sampleSize);

      const scale = Math.min(sampleSize / img.width, sampleSize / img.height);
      const drawW = img.width * scale;
      const drawH = img.height * scale;
      const dx = (sampleSize - drawW) / 2;
      const dy = (sampleSize - drawH) / 2;

      octx.drawImage(img, dx, dy, drawW, drawH);
      const data = octx.getImageData(0, 0, sampleSize, sampleSize).data;

      const offsetX = (width - boxSize) / 2;
      const offsetY = (height - boxSize) / 2 + 34;
      const cellW = boxSize / sampleSize;
      const cellH = boxSize / sampleSize;

      for (let y = 0; y < sampleSize; y++) {
        for (let x = 0; x < sampleSize; x++) {
          const idx = (y * sampleSize + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          const brightness = (r + g + b) / 3;

          if (brightness > 62) {
            targets.push({
              x: offsetX + x * cellW + cellW * 0.5,
              y: offsetY + y * cellH + cellH * 0.5,
              color: `rgb(${r}, ${g}, ${b})`,
              alpha: Math.min(1, brightness / 185)
            });
          }
        }
      }
    }

    function initParticles() {
      particles = [];
      const bgCount = 160;

      for (let i = 0; i < targets.length; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          tx: targets[i].x,
          ty: targets[i].y,
          color: targets[i].color,
          baseAlpha: targets[i].alpha,
          isTarget: true,
          size: 1.25,
          speed: 0.011 + Math.random() * 0.008, // تجمع أبطأ وأهدأ للصورة
          phase: Math.random() * Math.PI * 2
        });
      }

      for (let i = 0; i < bgCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.16,
          vy: (Math.random() - 0.5) * 0.16,
          color: "rgba(255, 235, 248, 0.8)",
          baseAlpha: 0.35,
          isTarget: false,
          size: Math.random() * 0.9 + 0.4,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function animate(now) {
      const elapsed = (now - startTime) / 1000;

      ctx.fillStyle = "rgba(18, 9, 28, 0.42)";
      ctx.fillRect(0, 0, width, height);

      const spawnProgress = Math.min(1, elapsed / 1.4);
      const visibleCount = Math.floor(particles.length * spawnProgress);

      for (let i = 0; i < visibleCount; i++) {
        const p = particles[i];
        const shimmer = 0.82 + 0.18 * Math.sin(elapsed * 3.5 + p.phase);

        if (p.isTarget) {
          if (elapsed > 1.2) {
            p.x += (p.tx - p.x) * p.speed;
            p.y += (p.ty - p.y) * p.speed;
          } else {
            p.x += Math.sin(elapsed * 2 + p.phase) * 0.35;
            p.y += Math.cos(elapsed * 2 + p.phase) * 0.35;
          }
        } else {
          p.x = (p.x + p.vx + width) % width;
          p.y = (p.y + p.vy + height) % height;
        }

        ctx.globalAlpha = p.baseAlpha * shimmer;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      // تبدأ كتابة الجملة بعد اكتمال تجمع الصورة بهدوء
      if (elapsed > 8.2) {
        const textElapsed = elapsed - 8.2;
        const charCount = Math.min(FULL_TEXT.length, Math.floor(textElapsed * 16));
        const currentText = FULL_TEXT.slice(0, charCount);

        const fontSize = Math.max(24, Math.min(38, width * 0.04));
        ctx.font = `italic ${fontSize}px Georgia, "Times New Roman", serif`;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";

        const boxSize = Math.min(width * 0.88, height * 0.68, 560);
        const textY = Math.max(58, (height - boxSize) / 2 - 8);
        ctx.fillText(currentText, width / 2, textY);
      }

      requestAnimationFrame(animate);
    }

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      if (loadedImage) {
        extractTargetsFromImage(loadedImage);
      }
      initParticles();
    }

    window.addEventListener("click", () => {
      audio.currentTime = 0;
      audio.play().catch(() => {});
      startTime = performance.now();
      initParticles();
      hint.style.opacity = "0";
    });

    window.addEventListener("resize", resize);
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    tryLoadImage(0);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
